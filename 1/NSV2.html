<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSV2</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.app{
    width:360px;
    background:#111827;
    border-radius:18px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.header{
    text-align:center;
    font-size:18px;
    margin-bottom:10px;
}

.stats{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:#9ca3af;
    margin-bottom:15px;
}

.step{
    background:#1f2937;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
}

.sub{background:#ef4444;color:white;}
.like{background:#3b82f6;color:white;}
.download{background:#22c55e;color:white;}

button:disabled{
    background:#555;
    cursor:not-allowed;
}

#msg{
    text-align:center;
    margin-top:10px;
    font-size:14px;
    color:#facc15;
}

.platform{
    margin-top:8px;
}
</style>
</head>
<body>

<div class="app">

<div class="header">Naruto Senki V2</div>

<div class="stats">
<span>Downloads: <span id="downloads">0</span></span>
<span>Status: Ready</span>
</div>

<div class="step">
<span>Subscribe to Channel</span>
<span id="s1">🔒</span>
</div>

<div class="step">
<span>Like Video</span>
<span id="s2">🔒</span>
</div>

<!-- PLATFORM BUTTONS -->
<button class="sub" id="subBtn">Subscribe</button>
<button class="like" id="likeBtn" disabled>Like The
Video</button>
<button class="download platform" id="androidBtn" disabled>Download for Android</button>
<button class="download platform" id="iosBtn" disabled>Download for iOS</button>
<button class="download platform" id="windowsBtn" disabled>Download for Windows</button>
<button class="download platform" id="linuxBtn" disabled>Download for Linux</button>


<div id="msg">Complete steps to unlock download</div>

</div>

<script>

let downloads = parseInt(localStorage.getItem("downloads")) || 1912;

const subBtn = document.getElementById("subBtn");
const likeBtn = document.getElementById("likeBtn");

const androidBtn = document.getElementById("androidBtn");
const iosBtn = document.getElementById("iosBtn");
const windowsBtn = document.getElementById("windowsBtn");

const s1 = document.getElementById("s1");
const s2 = document.getElementById("s2");

const msg = document.getElementById("msg");
const dlCount = document.getElementById("downloads");

function update() {
    if (downloads >= 1000000) {
        dlCount.innerText = (downloads / 1000000).toFixed(1).replace(".0", "") + "M";
    } else if (downloads >= 1000) {
        dlCount.innerText = (downloads / 1000).toFixed(1).replace(".0", "") + "K";
    } else {
        dlCount.innerText = downloads;
    }
}

// TIMER
function wait(sec, cb){
    let t = sec;
    msg.innerText = "Please wait " + t + "s...";

    let i = setInterval(()=>{
        t--;
        msg.innerText = "Please wait " + t + "s...";

        if(t <= 0){
            clearInterval(i);
            cb();
        }
    },1000);
}

// STEP 1 - SUBSCRIBE
subBtn.onclick = () => {
    window.open("https://www.youtube.com/@Saikyokonbi?sub_confirmation=1");

    subBtn.disabled = true;

    wait(5, ()=>{
        s1.innerHTML = "✅";
        likeBtn.disabled = false;
        msg.innerText = "Subscribe completed.";
    });
};

// STEP 2 - LIKE (UNLOCK PLATFORMS)
likeBtn.onclick = () => {
    window.open("https://youtu.be/PvUI1AZpXww?si=bOwKS5Ij3h9-4Rzv");

    likeBtn.disabled = true;

    wait(5, ()=>{
        s2.innerHTML = "✅";

        androidBtn.disabled = false;
        iosBtn.disabled = false;
        windowsBtn.disabled = false;

        msg.innerText = "Choose your platform.";
    });
};

// DOWNLOAD FUNCTION
function downloadAction(link, text){
    downloads++;
    localStorage.setItem("downloads", downloads);
    update();

    msg.innerText = "Opening " + text + "...";

    setTimeout(()=>{
        window.open(link, "_blank");
    }, 1000);
}

// ANDROID
androidBtn.onclick = () => {
    downloadAction("https://github.com/Naruto-Senki/files/releases/download/v2.1.6-fix/NSV2_2.1.6-fix_Android.apk", "Android download");
};

// IOS
iosBtn.onclick = () => {
    downloadAction("https://github.com/Naruto-Senki/files/releases/download/v2.1.6-fix/NSV2_2.1.6-fix_iOS.ipa", "iOS download");
};

// WINDOWS
windowsBtn.onclick = () => {
    downloadAction("https://github.com/Naruto-Senki/files/releases/download/v2.1.6-fix/NSV2_2.1.6-fix_Windows_x64.zip", "Windows download");
};

// LINUX
linuxBtn.onclick = () => {
    downloadAction("https://github.com/Naruto-Senki/files/releases/download/v2.1.6-fix/NSV2_2.1.6-fix_Linux_x64.tar.gz", "Linux download");
};

</script>

</body>
</html>
