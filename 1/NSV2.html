<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSV2</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.app{
    width:360px;
    background:#111827;
    border-radius:18px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.header{
    text-align:center;
    font-size:18px;
    margin-bottom:10px;
}

.stats{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:#9ca3af;
    margin-bottom:15px;
}

.step{
    background:#1f2937;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
}

.sub{background:#ef4444;color:white;}
.like{background:#3b82f6;color:white;}
.download{background:#22c55e;color:white;}

button:disabled{
    background:#555;
    cursor:not-allowed;
}

#msg{
    text-align:center;
    margin-top:10px;
    font-size:14px;
    color:#facc15;
}

.platform{
    margin-top:8px;
}
</style>
</head>
<body>

<div class="app">

<div class="header">Naruto Senki V2</div>

<div class="stats">
<span>Downloads: <span id="downloads">0</span></span>
<span>Status: Ready</span>
</div>

<div class="step">
<span>Subscribe to Channel</span>
<span id="s1">🔒</span>
</div>

<div class="step">
<span>Like Video</span>
<span id="s2">🔒</span>
</div>

<!-- PLATFORM BUTTONS -->
<button class="sub" id="subBtn">Subscribe</button>
<button class="like" id="likeBtn" disabled>Like The
Video</button>
<button class="download platform" id="androidBtn" disabled>Download for Android</button>
<button class="download platform" id="iosBtn" disabled>Download for iOS</button>

<div id="msg">Complete steps to unlock download</div>

</div>

<!-- FIREBASE SDK -->
 <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyB8hVRq2Dhidcb4gRs5jIxH6Rp1-1Mgt6g",
  authDomain: "total-downloads.firebaseapp.com",
  databaseURL: "https://total-downloads-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "total-downloads",
  storageBucket: "total-downloads.firebasestorage.app",
  messagingSenderId: "263111189557",
  appId: "1:263111189557:web:a4f0884bbdd61bba53bd7c",
  measurementId: "G-XXFDCVEYMW"
};

// INIT FIREBASE
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// GLOBAL DOWNLOAD COUNTER
const ref = db.ref("downloads");

ref.on("value", (snap) => {
    let val = snap.val();

    if (val === null) val = 0;

    document.getElementById("downloads").innerText = val;
});

// UI
const subBtn = document.getElementById("subBtn");
const likeBtn = document.getElementById("likeBtn");
const dlBtn = document.getElementById("dlBtn");

const s1 = document.getElementById("s1");
const s2 = document.getElementById("s2");

const msg = document.getElementById("msg");
const dlCount = document.getElementById("downloads");

// LIVE GLOBAL COUNTER
ref.on("value", (snap) => {
    dlCount.innerText = snap.val() || 0;
});

// ADD GLOBAL DOWNLOAD
function addDownload(){
    ref.transaction((current) => {
        return (current || 0) + 1;
    });
}

// TIMER
function wait(sec, cb){
    let t = sec;
    msg.innerText = "Please wait " + t + "s...";

    let i = setInterval(()=>{
        t--;
        msg.innerText = "Please wait " + t + "s...";

        if(t <= 0){
            clearInterval(i);
            cb();
        }
    },1000);
}

// Subscribe
subBtn.onclick = ()=>{
    window.open("https://www.youtube.com/@Saikyokonbi?sub_confirmation=1","_blank");

    subBtn.disabled = true;

    wait(5,()=>{
        s1.innerHTML = "✅";
        likeBtn.disabled = false;
        msg.innerText = "Subscribe completed.";
    });
};

// Like
likeBtn.onclick = ()=>{
    window.open("https://www.youtube.com/watch?v=zNJca5qw2XI&t=115s","NSV2");

    likeBtn.disabled = true;

    wait(5,()=>{
        s2.innerHTML = "✅";

        androidBtn.disabled = false;
        iosBtn.disabled = false;
        windowsBtn.disabled = false;
        linuxBtn.disabled = false;

        msg.innerText = "Choose your platform.";
    });
};

// Download
function downloadAction(link, text){
    addDownload();

    msg.innerText = "Opening " + text + "...";

    setTimeout(()=>{
        window.open(link,"_blank");
    },1000);
}

// Android
androidBtn.onclick=()=>{
    downloadAction("https://github.com/Naruto-Senki/files/releases/download/v2.1.6-fix/NSV2_2.1.6-fix_Android.apk","Android download");
};

// iOS
iosBtn.onclick=()=>{
    downloadAction("https://github.com/Naruto-Senki/files/releases/download/v2.1.6-fix/NSV2_2.1.6-fix_iOS.ipa","iOS download");
};

</script>

</body>
</html>
